<div class="nap-layout" [class.sidebar-open]="sidebarOpen">
  <aside class="nap-sidebar" [class.collapsed]="!sidebarOpen">
    <div class="sidebar-inner">
      <!-- TOGGLE -->
      <button class="sidebar-toggle" (click)="sidebarOpen = !sidebarOpen" title="Menú">
        <i class="fas fa-bars"></i>
      </button>

      <!-- BRAND -->
      <div class="sidebar-brand" *ngIf="sidebarOpen">
        <img src="/nechologo1.png" alt="Necho's Logo" class="brand-logo" />
        <span class="brand-text">Necho's</span>
        <span class="brand-sub">Auto Parts</span>
      </div>

      <!-- NAV -->
      <nav class="sidebar-nav">
        <button
          class="nav-item"
          routerLink="devoluciones"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <i class="fas fa-undo nav-icon"></i>
          <span class="nav-label" *ngIf="sidebarOpen">Devoluciones</span>
        </button>
        <button
          class="nav-item"
          routerLink="pedidos"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <i class="fas fa-shopping-cart nav-icon"></i>
          <span class="nav-label" *ngIf="sidebarOpen">Pedidos</span>
        </button>
        <button
          class="nav-item"
          routerLink="ventas"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <i class="fas fa-dollar-sign nav-icon"></i>
          <span class="nav-label" *ngIf="sidebarOpen">Ventas</span>
        </button>
        <button
          class="nav-item"
          routerLink="cierres"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <i class="fas fa-lock nav-icon"></i>
          <span class="nav-label" *ngIf="sidebarOpen">Cierres</span>
        </button>
      </nav>

      <!-- BACK -->
      <button class="btn-back" (click)="onBack()">
        <i class="fas fa-sign-out-alt nav-icon"></i>
        <span class="nav-label" *ngIf="sidebarOpen">Regresar</span>
      </button>
    </div>
  </aside>

  <main>
    <router-outlet></router-outlet>
  </main>

  <!-- Capa oscura flotante para móviles -->
  <div class="sidebar-overlay" *ngIf="sidebarOpen" (click)="sidebarOpen = false"></div>
</div>
